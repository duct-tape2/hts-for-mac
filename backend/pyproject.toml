[project]
name = "moa-desk-api"
version = "0.23.0rc2"
description = "Mac용 키움 REST API 기반 국내·미국주식 조회 전용 API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.115.14",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.10.6",
  "kwcli==1.0.2",
  "keyring==25.7.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
